<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - StockMonitor</title>
    <script src="{{ url_for('static', filename='tailwind.min.js') }}"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">
                <span class="text-blue-400">◆</span> 量化监测
            </h1>
            <p class="text-gray-500 mt-2 text-sm">StockMonitor与推送系统</p>
        </div>
        <form method="POST" action="/login" class="bg-gray-800 rounded-xl p-8 shadow-2xl">
            {% if error %}
            <div class="bg-red-500/20 text-red-400 text-sm px-4 py-3 rounded-lg mb-4">{{ error }}</div>
            {% endif %}
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">访问密码</label>
                <input type="password" name="password" autofocus
                       class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="请输入访问密码">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-3 text-sm font-medium transition-colors">
                登 录
            </button>
        </form>
    </div>
</body>
</html>
